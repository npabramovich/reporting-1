       and public/favicon.ico (scripts/generate-favicons.mjs, which centres it in a square)
       and for MARK_PATHS in lib/brand-mark.ts, which draws the home-screen icons and the
       sign-in screen's mark. The same file is public/welden-mark.svg in the site. -->
